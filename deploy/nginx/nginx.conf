worker_processes 1;
pid /tmp/nginx.pid;
# Nginx error messages can echo request query strings, including key/info keys.
# Per-request metadata exists only in the gateway database with its retention TTL.
# Docker capacity rotation is for non-request system diagnostics, not a seven-day TTL.
error_log /dev/null emerg;
events { worker_connections 128; }
http {
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    reset_timedout_connection on;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream gateway_backend {
        zone gateway_backend 64k;
        server gateway:4000 resolve;
        keepalive 4;
    }

    server {
        listen 8080;
        # No public docs, health, admin, alternate inference, or arbitrary paths.
        location = /v1/chat/completions {
            if ($request_method != POST) { return 405; }
            if ($args != "") { return 400; }
            include /etc/nginx/proxy.inc;
        }
        location = /v1/models {
            if ($request_method != GET) { return 405; }
            if ($args != "") { return 400; }
            include /etc/nginx/proxy.inc;
        }
        location / { return 404; }
    }

    server {
        listen 8081;
        # Private loopback-only entrance; native/guard authentication still applies.
        location = /key/generate {
            if ($request_method != POST) { return 405; }
            include /etc/nginx/proxy.inc;
        }
        location = /key/delete {
            if ($request_method != POST) { return 405; }
            include /etc/nginx/proxy.inc;
        }
        location = /key/info {
            if ($request_method != GET) { return 405; }
            include /etc/nginx/proxy.inc;
        }
        location = /key/list {
            if ($request_method != GET) { return 405; }
            include /etc/nginx/proxy.inc;
        }
        location = /gateway/status {
            if ($request_method != GET) { return 405; }
            include /etc/nginx/proxy.inc;
        }
        location = /gateway/summary {
            if ($request_method != GET) { return 405; }
            include /etc/nginx/proxy.inc;
        }
        location = /gateway/resources {
            if ($request_method != GET) { return 405; }
            include /etc/nginx/proxy.inc;
        }
        location = /gateway/config {
            if ($request_method != GET) { return 405; }
            include /etc/nginx/proxy.inc;
        }
        location = /gateway/traces {
            if ($request_method != GET) { return 405; }
            include /etc/nginx/proxy.inc;
        }
        location = /gateway/drain {
            if ($request_method != POST) { return 405; }
            include /etc/nginx/proxy.inc;
        }
        location / { return 404; }
    }
}
