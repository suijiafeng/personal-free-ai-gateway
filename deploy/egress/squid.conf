# Squid 7.7 (official stable source, checksum pinned). No TLS interception, auth, or body logs.
http_port 3128
visible_hostname gateway-reviewed-egress
acl CONNECT method CONNECT
acl TLS_port port 443
# No leading dot: exact host only. -n disables IP-to-domain reverse lookup.
acl approved_hosts dstdomain -n "/etc/squid/approved-hosts.txt"
acl blocked_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl blocked_dst dst ::/128 ::1/128 64:ff9b::/96 64:ff9b:1::/48 100::/64 2001::/32 2001:db8::/32 2002::/16 fc00::/7 fe80::/10 ff00::/8
http_access deny !CONNECT
http_access deny !TLS_port
http_access deny !approved_hosts
http_access deny blocked_dst
http_access allow CONNECT TLS_port approved_hosts
http_access deny all
cache deny all
access_log none
cache_store_log none
# Squid diagnostics may include CONNECT targets: no untrusted request text is logged.
cache_log /dev/null
pid_filename /tmp/squid.pid
coredump_dir /tmp
cache_mem 0 MB
maximum_object_size 0 KB
icp_port 0
shutdown_lifetime 1 seconds
forwarded_for delete
via off
